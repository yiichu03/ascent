defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_mp3d
  - /habitat/task/lab_sensors:
      - base_explorer
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
    - multi_floor_map # frontier_exploration_map
    - traveled_stairs
  - /habitat_baselines/rl/policy: ascent_policy
  - _self_

ascent_vo:
  enabled: true
  provider: "zhao_rgbd_2021"
  checkpoint_dir: ${oc.env:ASCENT_VO_CHECKPOINT_DIR,../PointNav-VO/pretrained_ckpts/vo}
  diagnostics_path: ${oc.env:ASCENT_VO_DIAGNOSTICS_PATH,debug/ascent_vo_mp3d_diagnostics.jsonl}

ascent_submaps:
  enabled: ${oc.env:ASCENT_SUBMAP_ENABLED,false}
  min_action_endpoints: 20
  min_path_length_m: 1.5
  overlap_threshold: 0.25
  low_overlap_consecutive: 3
  max_motion_budget_m: 8.0
  rotation_weight_m_per_rad: 0.10
  gateway_frontier_resolution_radius_m: 1.0
  gateway_reached_radius_m: 0.9
  overlap_sample_stride: 16
  overlap_ray_samples: 4
  overlap_explored_dilation_cells: 3
  overlap_min_valid_samples: 32
  overlap_min_explored_cells: 400
  provisional_thresholds: true
  allow_provisional_thresholds: ${oc.env:ASCENT_SUBMAP_ALLOW_PROVISIONAL,false}
  diagnostics_path: ${oc.env:ASCENT_SUBMAP_DIAGNOSTICS_PATH,debug/ascent_submap_mp3d_diagnostics.jsonl}

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        turn_angle: 30
        area_thresh: 1.5

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False
  verbose: false
  torch_gpu_id: 0
  tensorboard_dir: "debug/tb_mp3d_debug"
  video_dir: "debug/video_mp3d_debug"
  test_episode_count: -1
  checkpoint_folder: "debug/"
  trainer_name: "ascent"
  num_updates: 270000
  log_interval: 10
  num_checkpoints: 100
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True
  eval_keys_to_include_in_name: ["success","spl","num_steps"]
  eval:
    split: "val"
    video_option: ["disk"]
    # extra_sim_sensors:
    #   third_rgb_sensor:
    #     height: 480
    #     width: 640
    #     position:
    #     - 0.0
    #     - 1.8
    #     - 0.5 # 0.0 - is back
    #     orientation:
    #     - -0.78 # -1.57 # 0.0
    #     - 0.0 # right -1.57
    #     - 0.0 #lay -1.57 
  rl:
    policy:
      main_agent:
        name: "Ascent_Policy"
        nearby_distance: 3.0 
        topk: 3 
        action_distribution_type: categorical
        obstacle_map_area_threshold: 1.5 
        pointnav_policy_path: "third_party/vlfm/data/pointnav_weights.pth"
    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 2
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50

      use_normalized_advantage: False

      hidden_size: 512
    ddppo:
      sync_frac: 0.6
      # The PyTorch distributed backend to use
      distrib_backend: NCCL
      # Visual encoder backbone
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      # Initialize with pretrained weights
      pretrained: False
      # Initialize just the visual encoder backbone with pretrained weights
      pretrained_encoder: False
      # Whether or not the visual encoder backbone will be trained.
      train_encoder: True
      # Whether or not to reset the critic linear layer
      reset_critic: False

      # Model parameters
      backbone: resnet18
      rnn_type: LSTM
      num_recurrent_layers: 2
